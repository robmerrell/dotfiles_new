config_version = 14

[bar.default]
concave_edge_corners = false
end = [ "media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "control-center", "session" ]

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1200.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Dracula"
community_palette = "Kanagawa Paper"
mode = "light"
source = "community"

[wallpaper.default]
path = "/home/rob/Pictures/Wallpapers/wp11599652-3440x1440-space-wallpapers.jpg"

[wallpaper.last]
path = "/home/rob/Pictures/Wallpapers/wp11599652-3440x1440-space-wallpapers.jpg"

[wallpaper.monitors.DP-2]
path = "/home/rob/Pictures/Wallpapers/wp11599652-3440x1440-space-wallpapers.jpg"
